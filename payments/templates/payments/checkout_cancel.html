{% extends "events/base.html" %}
{% block title %}Payment cancelled — EventFlow{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="status-page">
    <div class="checkout-card text-center">
      <div class="status-icon danger">
        <i class="bi bi-x-lg"></i>
      </div>
      <h1 class="h3 fw-bold mb-2">Payment cancelled</h1>
      <p class="text-muted mb-1">No charge was made and your cart is still saved.</p>
      <p class="text-muted small">You can try checkout again whenever you're ready.</p>

      <div class="d-flex flex-wrap justify-content-center gap-2 mt-4">
        <a href="{% url 'events-home' %}" class="btn btn-primary">
          <i class="bi bi-arrow-repeat me-1"></i>Try again
        </a>
        <a href="{% url 'my-rsvp-history' %}" class="btn btn-outline-secondary">
          <i class="bi bi-ticket-perforated me-1"></i>My tickets
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
