{% extends 'events/base.html' %}

{% block title %}Create account — EventFlow{% endblock %}

{% block content %}
<div class="auth-page">
  <div class="auth-card card">
    <div class="card-header">
      <h2 class="h4 mb-1"><i class="bi bi-person-plus me-2"></i>Create account</h2>
      <p class="text-muted small mb-0">Join EventFlow to discover and host events</p>
    </div>
    <div class="card-body">
      <form method="post">
        {% csrf_token %}

        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control" id="username" name="username" required
              placeholder="Choose a username" autocomplete="username">
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control" id="email" name="email" required
              placeholder="you@example.com" autocomplete="email">
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control" id="password" name="password" required
              placeholder="Create a password" autocomplete="new-password">
          </div>
          <div class="form-text">Use at least 8 characters.</div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2">
          <i class="bi bi-person-plus me-2"></i>Create account
        </button>
      </form>
    </div>
    <div class="card-footer">
      <p class="mb-0 text-muted small">
        Already have an account?
        <a href="{% url 'user-login' %}" class="fw-semibold">Sign in</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
